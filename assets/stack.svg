<svg width="1100" height="300" viewBox="0 0 1100 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Core strengths and current projects" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<linearGradient id="bar" gradientUnits="userSpaceOnUse" x1="236" y1="0" x2="456" y2="0"><stop offset="0" stop-color="#3fb950"/><stop offset=".55" stop-color="#58a6ff"/><stop offset="1" stop-color="#bc8cff"/></linearGradient>
<linearGradient id="sh"><stop offset="0" stop-color="#58a6ff" stop-opacity="0"/><stop offset=".5" stop-color="#58a6ff"/><stop offset="1" stop-color="#58a6ff" stop-opacity="0"/></linearGradient>
<pattern id="seg" width="8" height="10" patternUnits="userSpaceOnUse" x="236"><rect x="5" width="3" height="10" fill="#0d1117"/></pattern>
<clipPath id="cl"><rect x="1" y="1" width="528" height="298" rx="10"/></clipPath>
<clipPath id="cr"><rect x="571" y="1" width="528" height="298" rx="10"/></clipPath>
</defs>
<style>
text{font-family:'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
.b{transform-box:fill-box;transform-origin:left center;transform:scaleX(0);animation:bar 1.3s cubic-bezier(.2,.8,.2,1) forwards}
.fi{opacity:0;animation:fi .6s ease forwards}
.ring{transform-box:fill-box;transform-origin:center;animation:pulse 2s ease-out infinite}
@keyframes bar{to{transform:scaleX(1)}}
@keyframes fi{to{opacity:1}}
@keyframes pulse{0%{transform:scale(1);opacity:.7}100%{transform:scale(3.4);opacity:0}}
@keyframes shim{from{transform:translateX(-220px)}to{transform:translateX(560px)}}
</style>

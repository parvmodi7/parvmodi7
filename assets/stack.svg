<rect x="571" y="1" width="528" height="298" rx="10" fill="#0d1117" stroke="#30363d"/>
<g clip-path="url(#cl)"><rect x="1" y="1" width="528" height="46" fill="#161b22"/><rect x="0" y="47" width="220" height="2" fill="url(#sh)" style="animation:shim 3.2s linear infinite"/></g>
<g clip-path="url(#cr)"><rect x="571" y="1" width="528" height="46" fill="#161b22"/><rect x="571" y="47" width="220" height="2" fill="url(#sh)" style="animation:shim 3.2s linear 1s infinite"/></g>
